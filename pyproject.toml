[project]
name = "agricatch"
version = "2.0.0"
description = "Declarative data aggregation for Django"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Asaf Zamir" }]
dependencies = [
    "Django>=5.2,<6.0",
    "lxml>=5.2",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agricatch", "agricatch.helpers", "tech"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "agricatch.settings"
testpaths = ["tests"]
markers = ["live: hits real networks; deselected by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ"]
