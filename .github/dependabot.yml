version: 2

updates:
  # Nothing was watching this before, so a CVE in Django or lxml would have sat
  # unnoticed. Weekly rather than daily: this is a small project and a flood of
  # PRs gets ignored, which is the same as having no alerts at all.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["pytest*", "ruff", "mypy", "coverage", "*-stubs", "types-*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
