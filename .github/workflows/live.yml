name: Live sources

# The offline suite proves the code still works. This proves the *sites* still
# look the way the importers expect, which is the failure that actually happens:
# a feed moves, a layout changes, and an importer quietly returns nothing.
#
# Kept off the push path deliberately, so a site having a bad morning never
# fails someone's pull request.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

env:
  DJANGO_DEBUG: "1"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Hit the real sources
        run: pytest -q -m live
